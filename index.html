<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <title>AI Tic Tac Toe</title>
  <style>
  body { background:#111; color:#eee; font-family:sans-serif; text-align:center; }
#board { display:grid; grid-template-columns:repeat(3, 100px); grid-gap:6px; justify-content:center; margin:20px auto; }
.cell { width:100px; height:100px; background:#222; font-size:48px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:2px solid #444; }
#status { font-size:20px; margin-top:10px; }
button { margin-top:12px; padding:8px 16px; font-size:16px; cursor:pointer; }
</style>
  </head>
  <body>
  <h1>AI Tic Tac Toe</h1>
  <p>You are X. The AI is O and never loses.</p>
<div id="board"></div>
<div id="status"></div>
<button id="restartBtn">Restart</button>
  <script src="game.js"></script>
  </body>
  </html>
